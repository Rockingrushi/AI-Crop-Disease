<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌱 AI Plant Disease Detector</title>

  <style>
    /* ---------- Background ---------- */
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1740&q=80') 
                  no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* ---------- Card Styling ---------- */
    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      padding: 30px;
      text-align: center;
      width: 90%;
      max-width: 420px;
      transition: 0.3s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    h2 {
      color: #2e7d32;
      font-size: 1.7rem;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }

    input[type="file"] {
      padding: 10px;
      border: 2px solid #66bb6a;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      background-color: #f1f8e9;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .btn {
      background-color: #388e3c;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 128, 0, 0.3);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: #2e7d32;
      transform: scale(1.03);
      box-shadow: 0 6px 15px rgba(0, 128, 0, 0.4);
    }

    video, canvas, img {
      width: 100%;
      margin-top: 15px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    #result {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #1b5e20;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    /* ---------- Loader ---------- */
    .loader {
      border: 4px solid #c8e6c9;
      border-top: 4px solid #2e7d32;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 15px auto;
      display: none;
      box-shadow: 0 0 10px rgba(0, 128, 0, 0.2);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ---------- History Panel ---------- */
    .history-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: #81c784;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 100, 0, 0.3);
      transition: all 0.3s ease;
    }

    .history-btn:hover {
      background-color: #66bb6a;
      transform: scale(1.1);
    }

    .history-panel {
      position: fixed;
      top: 0;
      right: -350px;
      width: 320px;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: -5px 0 15px rgba(0,0,0,0.3);
      padding: 20px;
      transition: right 0.4s ease;
      overflow-y: auto;
    }

    .history-panel.active {
      right: 0;
    }

    .history-panel h3 {
      color: #2e7d32;
      text-align: center;
      margin-bottom: 15px;
    }

    .history-item {
      margin-bottom: 15px;
      padding: 10px;
      background: #e8f5e9;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      transition: transform 0.2s ease;
    }

    .history-item:hover {
      transform: scale(1.02);
    }

    .history-item img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 5px;
    }

    @media (max-width: 600px) {
      h2 { font-size: 1.4rem; }
      .btn { font-size: 14px; }
      .history-panel { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="card">
    <button class="history-btn" id="historyBtn">🕓</button>
    <h2>🌿 AI Plant Disease Detector</h2>

    <input type="file" id="fileInput" accept="image/*" capture="camera" />
    <video id="camera" autoplay playsinline style="display:none;"></video>
    <canvas id="snapshot" style="display:none;"></canvas>

    <button id="captureBtn" class="btn">📸 Capture from Camera</button>
    <button id="detectBtn" class="btn">🔍 Detect Disease</button>

    <div id="previewContainer">
      <img id="previewImage" src="#" alt="Image Preview" style="display:none;">
    </div>

    <div class="loader" id="loader"></div>
    <div id="result"></div>
  </div>

  <!-- ---------- History Panel ---------- -->
  <div class="history-panel" id="historyPanel">
    <h3>🧾 Detection History</h3>
    <div id="historyContent"></div>
  </div>

  <script>
    const camera = document.getElementById("camera");
    const snapshot = document.getElementById("snapshot");
    const captureBtn = document.getElementById("captureBtn");
    const detectBtn = document.getElementById("detectBtn");
    const fileInput = document.getElementById("fileInput");
    const previewImage = document.getElementById("previewImage");
    const resultDiv = document.getElementById("result");
    const loader = document.getElementById("loader");
    const historyBtn = document.getElementById("historyBtn");
    const historyPanel = document.getElementById("historyPanel");
    const historyContent = document.getElementById("historyContent");

    let capturedBlob = null;
    let history = JSON.parse(localStorage.getItem('detectionHistory')) || [];

    // Save history to localStorage
    function saveHistory() {
      localStorage.setItem('detectionHistory', JSON.stringify(history));
    }

    // Camera capture
    captureBtn.addEventListener("click", async () => {
      if (camera.style.display === "none") {
        camera.style.display = "block";
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        camera.srcObject = stream;
        captureBtn.textContent = "📷 Take Picture";
      } else {
        const ctx = snapshot.getContext("2d");
        snapshot.width = camera.videoWidth;
        snapshot.height = camera.videoHeight;
        ctx.drawImage(camera, 0, 0);
        camera.srcObject.getTracks().forEach(track => track.stop());
        camera.style.display = "none";

        snapshot.toBlob(blob => {
          capturedBlob = blob;
          previewImage.src = URL.createObjectURL(blob);
          previewImage.style.display = "block";
        }, "image/jpeg");
        captureBtn.textContent = "📸 Capture from Camera";
      }
    });

    // Detect Disease
    detectBtn.addEventListener("click", async () => {
      const formData = new FormData();
      if (capturedBlob) {
        formData.append("file", capturedBlob, "capture.jpg");
      } else if (fileInput.files.length > 0) {
        formData.append("file", fileInput.files[0]);
      } else {
        alert("Please upload or capture an image first!");
        return;
      }

      resultDiv.innerHTML = "";
      loader.style.display = "block";

      try {
        const response = await fetch("/predict", { method: "POST", body: formData });
        const data = await response.json();
        loader.style.display = "none";
        resultDiv.innerHTML = `<h3>🧬 Detected Disease: <span style="color:#2e7d32;">${data.disease}</span></h3>`;

        // Save to history
        const imgSrc = previewImage.src;
        history.unshift({ img: imgSrc, disease: data.disease });
        if (history.length > 3) history.pop();
        saveHistory();
        updateHistory();

      } catch (error) {
        loader.style.display = "none";
        resultDiv.innerHTML = "⚠️ Error analyzing image. Please try again.";
      }
    });

    // Update history panel
    function updateHistory() {
      historyContent.innerHTML = history.map(item => `
        <div class="history-item">
          <img src="${item.img}" alt="History Image">
          <p><strong>${item.disease}</strong></p>
        </div>
      `).join("");
    }

    // Toggle history panel
    historyBtn.addEventListener("click", () => {
      historyPanel.classList.toggle("active");
      updateHistory(); // Update history when panel is opened
    });
  </script>
</body>
</html>
