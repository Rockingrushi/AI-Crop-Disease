<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌱 AI Plant Disease Detector & Cure Guide</title>

  <style>
    /* ---------- Background & Page Layout ---------- */
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: url('https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1740&q=80') 
                  no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
      overflow-y: auto;
    }

    /* ---------- Card Styling ---------- */
    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      padding: 30px;
      text-align: center;
      width: 100%;
      max-width: 580px;
      transition: all 0.3s ease;
      position: relative;
      margin: auto 0;
    }

    h2 {
      color: #1b5e20;
      font-size: 1.8rem;
      margin-top: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .subtitle {
      color: #4b6b50;
      font-size: 0.95rem;
      margin-top: -12px;
      margin-bottom: 20px;
    }

    /* ---------- Inputs & Buttons ---------- */
    .input-wrapper {
      margin-bottom: 12px;
    }

    input[type="file"] {
      padding: 12px;
      border: 2px dashed #66bb6a;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      background-color: #f1f8e9;
      box-sizing: border-box;
      font-size: 14px;
      color: #2e7d32;
      transition: border-color 0.2s;
    }

    input[type="file"]:hover {
      border-color: #2e7d32;
      background-color: #e8f5e9;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      background: linear-gradient(135deg, #388e3c, #2e7d32);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
      transition: all 0.25s ease;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #43a047, #388e3c);
    }

    video, canvas, #previewImage {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      margin-top: 15px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    /* ---------- Loader ---------- */
    .loader {
      border: 4px solid #c8e6c9;
      border-top: 4px solid #2e7d32;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 1s linear infinite;
      margin: 25px auto;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ---------- Diagnosis Results ---------- */
    #result {
      margin-top: 25px;
      text-align: left;
    }

    .result-card {
      background: #ffffff;
      border: 1px solid #dcedc8;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 2px solid #e8f5e9;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .result-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1b5e20;
      margin: 0;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-healthy {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .status-infected {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .status-pest {
      background-color: #fff8e1;
      color: #f57f17;
      border: 1px solid #ffe082;
    }

    /* Section Boxes */
    .info-section {
      margin-top: 15px;
      padding: 14px;
      border-radius: 12px;
    }

    .section-precautions {
      background: #f1f8e9;
      border-left: 4px solid #689f38;
    }

    .section-medicines {
      background: #e3f2fd;
      border-left: 4px solid #1976d2;
    }

    .section-cure {
      background: #fff9c4;
      border-left: 4px solid #fbc02d;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-precautions .section-title { color: #33691e; }
    .section-medicines .section-title { color: #0d47a1; }
    .section-cure .section-title { color: #f57f17; }

    .info-list {
      margin: 0;
      padding-left: 20px;
      color: #37474f;
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .info-list li {
      margin-bottom: 6px;
    }

    .cure-text {
      margin: 0;
      color: #37474f;
      font-size: 0.92rem;
      line-height: 1.55;
    }

    /* ---------- History Panel ---------- */
    .history-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      color: #2e7d32;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }

    .history-btn:hover {
      background-color: #c8e6c9;
      transform: scale(1.08);
    }

    .history-panel {
      position: fixed;
      top: 0;
      right: -360px;
      width: 330px;
      height: 100%;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(8px);
      box-shadow: -5px 0 25px rgba(0, 0, 0, 0.25);
      padding: 25px 20px;
      box-sizing: border-box;
      transition: right 0.35s ease;
      overflow-y: auto;
      z-index: 1000;
    }

    .history-panel.active {
      right: 0;
    }

    .history-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e8f5e9;
    }

    .history-panel h3 {
      color: #1b5e20;
      margin: 0;
      font-size: 1.25rem;
    }

    .close-history-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #666;
    }

    .close-history-btn:hover {
      color: #000;
    }

    .history-item {
      margin-bottom: 15px;
      padding: 12px;
      background: #f1f8e9;
      border: 1px solid #dcedc8;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .history-item img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .history-item p {
      margin: 4px 0 0 0;
      font-size: 0.92rem;
      color: #2e7d32;
    }

    @media (max-width: 600px) {
      body { padding: 15px 10px; }
      .card { padding: 20px; max-width: 100%; }
      h2 { font-size: 1.45rem; }
      .button-group { flex-direction: column; }
      .history-panel { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="card">
    <button class="history-btn" id="historyBtn" title="View Detection History">🕒</button>
    <h2>🌿 AI Plant Disease Detector</h2>
    <div class="subtitle">Instant Diagnosis, Precautions & Pesticide Cure Guide</div>

    <div class="input-wrapper">
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <video id="camera" autoplay playsinline style="display:none;"></video>
    <canvas id="snapshot" style="display:none;"></canvas>

    <div class="button-group">
      <button id="captureBtn" class="btn btn-secondary">📸 Camera</button>
      <button id="detectBtn" class="btn">🔍 Detect & Get Cure</button>
    </div>

    <div id="previewContainer">
      <img id="previewImage" src="#" alt="Image Preview" style="display:none;">
    </div>

    <div class="loader" id="loader"></div>
    <div id="result"></div>
  </div>

  <!-- ---------- History Panel ---------- -->
  <div class="history-panel" id="historyPanel">
    <div class="history-panel-header">
      <h3>🧾 Recent Diagnoses</h3>
      <button class="close-history-btn" id="closeHistoryBtn">&times;</button>
    </div>
    <div id="historyContent">
      <p style="color:#777; text-align:center;">No past scans yet.</p>
    </div>
  </div>

  <script>
    const camera = document.getElementById("camera");
    const snapshot = document.getElementById("snapshot");
    const captureBtn = document.getElementById("captureBtn");
    const detectBtn = document.getElementById("detectBtn");
    const fileInput = document.getElementById("fileInput");
    const previewImage = document.getElementById("previewImage");
    const resultDiv = document.getElementById("result");
    const loader = document.getElementById("loader");
    const historyBtn = document.getElementById("historyBtn");
    const closeHistoryBtn = document.getElementById("closeHistoryBtn");
    const historyPanel = document.getElementById("historyPanel");
    const historyContent = document.getElementById("historyContent");

    let capturedBlob = null;
    let cameraStream = null;
    let history = JSON.parse(localStorage.getItem('detectionHistory')) || [];

    // Preview uploaded file
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        capturedBlob = null;
        previewImage.src = URL.createObjectURL(file);
        previewImage.style.display = "block";
        resultDiv.innerHTML = "";
        // Close camera if open
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
          camera.style.display = "none";
          captureBtn.textContent = "📸 Camera";
        }
      }
    });

    // Save history to localStorage
    function saveHistory() {
      localStorage.setItem('detectionHistory', JSON.stringify(history));
    }

    // Camera capture
    captureBtn.addEventListener("click", async () => {
      if (camera.style.display === "none") {
        try {
          camera.style.display = "block";
          previewImage.style.display = "none";
          resultDiv.innerHTML = "";
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } }
          });
          camera.srcObject = cameraStream;
          captureBtn.textContent = "📷 Take Picture";
        } catch (err) {
          alert("Camera access was denied or is not supported on this device.");
        }
      } else {
        const ctx = snapshot.getContext("2d");
        snapshot.width = camera.videoWidth || 640;
        snapshot.height = camera.videoHeight || 480;
        ctx.drawImage(camera, 0, 0, snapshot.width, snapshot.height);
        
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
          cameraStream = null;
        }
        camera.style.display = "none";

        snapshot.toBlob(blob => {
          capturedBlob = blob;
          previewImage.src = URL.createObjectURL(blob);
          previewImage.style.display = "block";
        }, "image/jpeg", 0.95);
        captureBtn.textContent = "📸 Camera";
      }
    });

    // Format badge class based on status
    function getStatusClass(status) {
      if (!status) return "status-infected";
      const s = status.toLowerCase();
      if (s.includes("healthy")) return "status-healthy";
      if (s.includes("pest")) return "status-pest";
      return "status-infected";
    }

    // Detect Disease
    detectBtn.addEventListener("click", async () => {
      const formData = new FormData();
      if (capturedBlob) {
        formData.append("file", capturedBlob, "capture.jpg");
      } else if (fileInput.files.length > 0) {
        formData.append("file", fileInput.files[0]);
      } else {
        alert("Please select or capture a plant image first!");
        return;
      }

      resultDiv.innerHTML = "";
      loader.style.display = "block";

      try {
        const response = await fetch("/predict", { method: "POST", body: formData });
        const data = await response.json();
        loader.style.display = "none";

        if (!response.ok || data.error) {
          resultDiv.innerHTML = `
            <div class="result-card" style="border-left: 4px solid #d32f2f;">
              <h3 style="color:#c62828; margin:0 0 8px 0;">⚠️ Detection Error</h3>
              <p style="margin:0; color:#555;">${data.error || "Unable to analyze image. Please try again."}</p>
            </div>
          `;
          return;
        }

        const displayName = data.display_name || data.disease || "Unknown Disease";
        const status = data.status || "Infected";
        const statusClass = getStatusClass(status);
        const precautions = data.precautions || [];
        const medicines = data.medicines_pesticides || [];
        const cureSteps = data.cure_steps || "";

        let html = `
          <div class="result-card">
            <div class="result-header">
              <h3 class="result-title">${displayName}</h3>
              <span class="status-badge ${statusClass}">${status}</span>
            </div>
        `;

        if (cureSteps) {
          html += `
            <div class="info-section section-cure">
              <div class="section-title">💡 Treatment & Quick Action</div>
              <p class="cure-text">${cureSteps}</p>
            </div>
          `;
        }

        if (medicines && medicines.length > 0) {
          html += `
            <div class="info-section section-medicines">
              <div class="section-title">💊 Recommended Medicines & Pesticides</div>
              <ul class="info-list">
                ${medicines.map(m => `<li>${m}</li>`).join("")}
              </ul>
            </div>
          `;
        }

        if (precautions && precautions.length > 0) {
          html += `
            <div class="info-section section-precautions">
              <div class="section-title">🛡️ Precautions & Prevention Tips</div>
              <ul class="info-list">
                ${precautions.map(p => `<li>${p}</li>`).join("")}
              </ul>
            </div>
          `;
        }

        html += `</div>`;
        resultDiv.innerHTML = html;

        // Save to local history
        const imgSrc = previewImage.src;
        history.unshift({ img: imgSrc, name: displayName, status: status });
        if (history.length > 5) history.pop();
        saveHistory();
        updateHistory();

      } catch (error) {
        loader.style.display = "none";
        resultDiv.innerHTML = `
          <div class="result-card" style="border-left: 4px solid #d32f2f;">
            <h3 style="color:#c62828; margin:0 0 8px 0;">⚠️ Server Connection Error</h3>
            <p style="margin:0; color:#555;">Could not reach the prediction service. Please check your network and try again.</p>
          </div>
        `;
      }
    });

    // Update history panel
    function updateHistory() {
      if (!history || history.length === 0) {
        historyContent.innerHTML = `<p style="color:#777; text-align:center;">No past scans yet.</p>`;
        return;
      }
      historyContent.innerHTML = history.map(item => `
        <div class="history-item">
          <img src="${item.img}" alt="Plant scan thumbnail" onerror="this.style.display='none'">
          <p><strong>${item.name}</strong></p>
          <small style="color:#666;">Status: ${item.status || "Completed"}</small>
        </div>
      `).join("");
    }

    // Toggle history panel
    historyBtn.addEventListener("click", () => {
      historyPanel.classList.add("active");
      updateHistory();
    });

    closeHistoryBtn.addEventListener("click", () => {
      historyPanel.classList.remove("active");
    });

    // Load history on initial startup
    updateHistory();
  </script>
</body>
</html>
